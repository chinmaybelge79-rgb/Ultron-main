[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron"
version = "0.2.0"
description = "Autonomous, local-first AI operating system for macOS."
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.0.0",
    "sounddevice>=0.4.6",
    "soundfile>=0.12.1",
    "numpy>=1.26.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "psutil>=5.9.0",
    "pyobjc-framework-Quartz>=9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]
rich = ["rich>=13.0"]
vision = ["pytesseract>=0.3.10"]
embeddings = ["sentence-transformers>=2.7.0"]

[project.scripts]
ultron = "ultron.app:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]